</style><rect width="100%" height="100%" fill="var(--cds-bg)"/><defs><marker id="fet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Kysely tekee yhden aallon: kaikki alueet lähtevät yhtä aikaa</text><text data-claude-text-id="subtitle" x="24" y="52" font-size="11.5" fill="var(--cds-text-secondary)">Ylhäällä kaksi peräkkäistä kierrosta, alhaalla yksi jossa kaikki alueet lähtevät yhtä aikaa</text><g data-claude-anchor="open-round"><text data-claude-text-id="lane-open" x="24" y="107" font-weight="600" fill="var(--cds-text-primary)">Avaus</text><rect x="166" y="86" width="130" height="32" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="open-tail" x="231" y="107" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">häntäluku 16 B</text><path d="M296 102H312" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#fet-arrow)"></path><rect x="312" y="86" width="170" height="32" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="open-cat" x="397" y="107" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">katalogi 18,7 MB</text><text data-claude-text-id="open-rounds" x="498" y="107" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">2 kierrosta, kerran</text></g><g data-claude-anchor="query-wave"><text data-claude-text-id="lane-query" x="24" y="198" font-weight="600" fill="var(--cds-text-primary)">Kysely</text><line x1="150" y1="152" x2="150" y2="266" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><rect x="166" y="152" width="360" height="24" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text data-claude-text-id="w-l1" x="178" y="168" font-size="11.5" fill="var(--cds-text-primary)">bm:ajoneuvoluokka:M1</text><rect x="166" y="182" width="280" height="24" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text data-claude-text-id="w-l2" x="178" y="198" font-size="11.5" fill="var(--cds-text-primary)">col:kayttoonotto, granulaväli</text><rect x="166" y="212" width="420" height="24" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text data-claude-text-id="w-l3" x="178" y="228" font-size="11.5" fill="var(--cds-text-primary)">bm:kayttovoima, kaikki arvot</text><rect x="166" y="242" width="200" height="24" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text data-claude-text-id="w-l4" x="178" y="258" font-size="11.5" fill="var(--cds-text-primary)">col:kayttoonotto:docs</text><text data-claude-text-id="wave-rounds" x="612" y="198" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">1 kierros</text><text data-claude-text-id="same-start" x="612" y="228" font-size="11.5" fill="var(--cds-text-secondary)">yhteinen alku</text></g><text data-claude-text-id="coalesce-1" x="24" y="294" font-size="11.5" fill="var(--cds-text-secondary)">Vierekkäisiä alueita ei yhdistetä ellei rinnakkaisuusbudjetti ylity.</text><text data-claude-text-id="coalesce-2" x="24" y="312" font-size="11.5" fill="var(--cds-text-secondary)">Mitattu: 3 MB:n aukon yli yhdistäminen maksoi 16 MB siellä missä erillisinä riitti 240 kB.</text></svg>